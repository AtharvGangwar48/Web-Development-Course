<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <h1 style="text-align: center;">Login Form</h1>
    <div class="container">
        <div class="row">
            <div class="col mb-3">
                <label for="EmailEntry" class="form-label">Email</label>
                <input type="email" class="form-control" id="EmailEntry" placeholder="Please enter your E-mail">
            </div>
            <div class="col mb-3">
                <label for="Phone" class="form-label">Phone number</label>
                <input type="text" class="form-control" id="Phone" placeholder="Please enter your Mobile number">
            </div>
        </div>
        <select class="form-select">
            <option selected>Select your Batch</option>
            <option value="23-27">2023-27</option>
            <option value="22-26">2022-26</option>
            <option value="21-25">2021-25</option>
            <option value="20-24">2020-24</option>
            <option value="other">Older Batch</option>
        </select>
        <br>
        <div class="row">
            <div class="col form-check-inline">
                <label for="checkbox" class="form-check-label">Is all the detail are registered with the authorities</label>
                <input id="checkbox" type="checkbox" class="form-check-input">
            </div>
            <div class="col form-check-inline">
                <label for="YesOrNo" class="radiobs">Did you enter another e-mail or phone that is registered by authorities</label>
                <input id="YesOrNo" type="radio" class="radiobs">
            </div>
        </div>
        <br>
        <div class="form-check form-switch">
            <label class="form-check-label" for="flexSwitchCheckDefault">Activate your Attendance Status</label>
            <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckDefault">
          </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
