<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Complete Form</title>
</head>
<body>
    <form action="/server">
        <div>
            <label for="Username"> Enter Username :</label>
            <input type="" placeholder="Username" id="Username"/>
        </div>
        <div>
            <label for="Password"> Enter Password :</label>
            <input type="password" placeholder="Password" id="Password"/>
        </div>
        <div>
            <label for="Age"> Enter Age :</label>
            <input type="number" placeholder="Age" id="Age"/>
            <button>Submit</button>
        </div>
        <hr>
        <div>
            <label for="apple">Apple</label>
            <input type="radio" name="fruits" id="apple">
            <label for="mango">Mango</label>
            <input type="radio" name="fruits" id="mango">
            <label for="banana">Banana</label>
            <input type="radio" name="fruits" id="banana">
        <hr> 
        <br>   
        </div>
        <div>
            <label for="age">I am 18+ :</label>
            <input type="checkbox" id="age" name="age" checked/>
            <button type="submit">Submit</button>
        </div>
        <hr>
        <br>
     <select name="Profession" id="Profession">
        <option value="student">Student</option>
        <option value="dev">Developer</option>
     <hr>
     <br>
     <label for="search_query">Search</label>
     <input type="text" placeholder="Search via youtube" id="search_query" name="search_query">
     <button type="submit">Submit</button>
     <br>
     <hr>
     <label for="google">Google it...</label>
     <input type="text" placeholder="Search via Google" id="google" name="q"/>
     <button type="submit">Submit it</button>   
    </form>
</body>
</html>
