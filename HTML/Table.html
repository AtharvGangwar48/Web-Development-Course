<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <h1>Creating a Table</h1>
    <table border="black">
      <thead>
        <caption>Food</caption>
          <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Amount</th>
          </tr>
      </thead>  
       <tbody>
        <tr>
            <td>Frooti</td>
            <td>2</td>
            <td>20</td>
         </tr>
         <tr>
            <td>Samosa</td>
            <td>2</td>
            <td>12</td>
         </tr>
         <tr>
            <td>Chips</td>
            <td>4</td>
            <td>80</td>
         </tr>
       </tbody>
       <tfoot>
          <tr>
            <td rowspan="2">Amount</td>
            <td> </td>
            <td>112</td>
          </tr>
       </tfoot>
    </table>
</body>
</html>
